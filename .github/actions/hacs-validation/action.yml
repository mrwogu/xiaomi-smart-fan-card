name: HACS validation
description: Run the pinned HACS repository validator

inputs:
  ignore:
    description: Space-separated HACS checks to ignore
    required: false
    default: ""
  category:
    description: HACS repository category
    required: true
  comment:
    description: Post a validation comment on pull requests
    required: false
    default: "true"
  github_token:
    description: GitHub token used by the validator
    required: false
    default: ${{ github.token }}

runs:
  using: docker
  # Pin the validator image instead of inheriting the mutable upstream main tag.
  image: docker://ghcr.io/hacs/action@sha256:122c0d191a82d1f0135ed2b70966ede31aaa2801cf32e9424d1957e6fb4370a6
